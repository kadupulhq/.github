# Reusable release workflow for every repository in the organisation.
#
# A repository opts in with a three-line caller that triggers on a version tag.
# The tag is the release: this workflow refuses to publish one that is not
# semver, or one the changelog does not describe.
name: Release

on:
  workflow_call:
    inputs:
      changelog:
        description: Path to the changelog to read release notes from.
        type: string
        default: CHANGELOG.md
      draft:
        description: Publish as a draft for a human to review before it goes out.
        type: boolean
        default: false
      tarball:
        description: Build an offline deployment tarball and attach it.
        type: boolean
        default: false
      image:
        description: Build and publish a container image to the registry.
        type: boolean
        default: false
      php-version:
        description: PHP the tarball is vendored against.
        type: string
        default: '8.3'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the tag is semver
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          version="${tag#v}"
          # The official semver 2.0.0 regex, anchored.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "::error::Tag '$tag' is not a semantic version. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$prerelease)"

      - name: Extract release notes
        id: notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::$CHANGELOG not found. Every release needs one." >&2
            exit 1
          fi
          # Take the lines between this version's heading and the next one.
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' "$CHANGELOG" | sed -e '/./,$!d')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::$CHANGELOG has no entry for $VERSION. Add one before tagging." >&2
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$notes"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes "$NOTES")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          [ "$DRAFT" = "true" ] && args+=(--draft)
          gh release create "$TAG" "${args[@]}"

  tarball:
    name: Offline tarball
    needs: release
    if: ${{ inputs.tarball }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Provenance is signed with the job's OIDC token and filed against the
      # repository's attestation store.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: ${{ hashFiles('composer.json') != '' }}
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: none

      # The point of this artefact is an install with no network. Runtime
      # dependencies are vendored in; development ones are not.
      - name: Vendor runtime dependencies
        if: ${{ hashFiles('composer.lock') != '' }}
        run: |
          composer install --no-dev --no-interaction --no-progress \
            --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Build
        id: build
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY##*/}"
          stem="${name}-${VERSION}"
          staging="$(mktemp -d)/${stem}"
          mkdir -p "$staging"

          # git archive honours export-ignore, so CI scaffolding stays out.
          git archive --format=tar HEAD | tar -x -C "$staging"
          [ -d vendor ] && cp -a vendor "$staging/vendor"
          [ -d include/vendor ] && mkdir -p "$staging/include" && cp -a include/vendor "$staging/include/vendor"

          # Reproducible: fixed order, fixed timestamps, no local ownership.
          # Split so set -e sees git fail; export would mask it and tar
          # would silently stamp an empty mtime, losing reproducibility.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          tar --sort=name --format=posix \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -C "$(dirname "$staging")" -cf "${stem}.tar" "${stem}"
          gzip -9n "${stem}.tar"
          sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          ls -l "${stem}.tar.gz"

      # Nothing gets published unattested, so this runs before the upload.
      # The sha256 file is a courtesy; the attestation is the real proof the
      # archive came from this workflow at this tag.
      - name: Attest the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.stem }}.tar.gz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          STEM: ${{ steps.build.outputs.stem }}
        run: gh release upload "$TAG" "${STEM}.tar.gz" "${STEM}.tar.gz.sha256" --clobber

  image:
    name: Container image
    needs: release
    if: ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The image, its cosign signature and the pushed attestation all write
      # to the same registry.
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a Dockerfile
        run: test -f Dockerfile || { echo "::error::No Dockerfile at the repository root."; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # Only a final release moves the floating tag; a prerelease must not.
          flavor: latest=${{ !contains(needs.release.outputs.version, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx writes SLSA provenance and an SPDX SBOM into the index, so a
          # pull of the image carries both without a second lookup.
          provenance: mode=max
          sbom: true

      # ghcr refuses an uppercase path and github.repository keeps the owner's
      # case. metadata-action folds it internally; the steps below cannot.
      - name: Resolve the image reference
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=${name}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Everything downstream keys off the digest. A tag can be moved to point
      # at a different image; a digest cannot.
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Also store it as a registry referrer, so a consumer can verify
          # without reaching the GitHub API.
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token, recorded
      # in the public transparency log. There is no key to leak or rotate.
      - name: Sign the image
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "$REF"
